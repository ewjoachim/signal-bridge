repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^signal_bridge/locales/  # written by pybabel
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff format
        name: ruff format
        entry: uv run ruff format --force-exclude
        types: [python]
        language: system

      - id: ruff check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        types: [python]
        language: system

      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        files: ^(pyproject\.toml|uv\.lock)$
        language: system
        pass_filenames: false

      - id: zizmor
        name: zizmor
        entry: uv run zizmor --fix=all --no-progress
        types: [yaml]
        files: \.github/(workflows/.*|dependabot\.ya?ml)$
        language: system
        require_serial: true

      - id: babel extract
        name: babel extract
        entry: uv run pybabel -q extract -F pyproject.toml --omit-header --no-location --sort-output -o signal_bridge/locales/signal_bridge.pot signal_bridge
        language: system
        files: ^signal_bridge/
        pass_filenames: false

      - id: babel update
        name: babel update
        entry: uv run pybabel -q update -i signal_bridge/locales/signal_bridge.pot -d signal_bridge/locales -D signal_bridge --ignore-pot-creation-date
        language: system
        files: ^signal_bridge/
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
